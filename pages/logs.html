<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniSphere - Session Logs</title>
    <meta name="description" content="Track your weekly and all-time study session logs." />
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body>
    <div id="root">
      <header class="site-header">
        <div class="header-top">
          <h2>UniSphere</h2>
          <div class="header-actions">
            <div id="sync-status" class="sync-status">Ready</div>
            <button type="button" id="btn-header-logout" hidden>Log-Out</button>
          </div>
        </div>
        <nav aria-label="Main Navigation">
          <ul id="nav-list" class="nav-list">
            <li><a href="/pages/dashboard.html" data-nav="dashboard">Dashboard</a></li>
            <li><a href="/pages/courses.html" data-nav="courses">Courses</a></li>
            <li><a href="/pages/logs.html" data-nav="logs" class="active-nav">Session Logs</a></li>
            <li><a href="/pages/assignments.html" data-nav="assignments">Exams &amp; Assignments</a></li>
            <li><a href="/pages/squads.html" data-nav="squads">Squads</a></li>
            <li><a href="/pages/settings.html" data-nav="settings">Settings</a></li>
          </ul>
        </nav>
      </header>

      <hr class="section-divider" />

      <main id="app-main" data-page="logs">
        <h1>Session Logs</h1>

        <div class="stack">
          <section class="card">
            <div class="card-header">
              <h3 id="logs-5day-header">Current 7-Day Week Study Time</h3>
              <button type="button" id="btn-export-logs-csv">Export CSV</button>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr id="logs-5day-thead"></tr>
                </thead>
                <tbody>
                  <tr id="logs-5day-tbody"></tr>
                </tbody>
              </table>
            </div>
          </section>

          <section class="card">
            <div class="card-header">
              <h3>Sessions Logs</h3>
              <div class="card-toolbar">
                <select id="filter-log-subject" class="inline-input" aria-label="Filter by Subject">
                  <option value="all" selected>All Subjects</option>
                </select>
                <button type="button" id="btn-logs-add">Add Log</button>
              </div>
            </div>

            <div class="table-wrap table-scroll">
              <table>
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Subject</th>
                    <th>Time</th>
                    <th>Tag</th>
                    <th>Notes</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="logs-registry-tbody"></tbody>
              </table>
            </div>
          </section>
        </div>
      </main>

      <!-- Native HTML Dialog: Add Session Log -->
      <dialog id="modal-log">
        <form id="form-log" method="dialog">
          <h3>Add Session Log</h3>
          <div class="form-row">
            <label for="log-subject">Subject / Course *</label>
            <input type="text" id="log-subject" list="course-suggestions" required placeholder="e.g. Analisi 1" />
            <datalist id="course-suggestions"></datalist>
          </div>
          <div class="form-row">
            <label for="log-date">Date *</label>
            <input type="date" id="log-date" required />
          </div>
          <div class="form-row">
            <label>Duration *</label>
            <div class="log-time-mode-toggle" role="tablist">
              <button type="button" class="log-time-tab active" data-time-mode="minutes">Minutes</button>
              <button type="button" class="log-time-tab" data-time-mode="hours-minutes">Hours &amp; Min</button>
              <button type="button" class="log-time-tab" data-time-mode="range">Time Range</button>
            </div>
            <input type="hidden" id="log-minutes" name="log-minutes" value="90" />
            <div id="log-mode-minutes" class="log-time-panel">
              <input type="number" id="log-minutes-input" min="5" max="720" step="5" value="90" placeholder="e.g. 90" />
            </div>
            <div id="log-mode-hours-minutes" class="log-time-panel hidden">
              <div class="form-grid-2">
                <div>
                  <label for="log-hours" style="font-size: 12px; font-weight: normal; color: #555;">Hours</label>
                  <input type="number" id="log-hours" min="0" max="12" step="1" value="1" placeholder="Hours" />
                </div>
                <div>
                  <label for="log-subminutes" style="font-size: 12px; font-weight: normal; color: #555;">Minutes</label>
                  <input type="number" id="log-subminutes" min="0" max="59" step="5" value="30" placeholder="Minutes" />
                </div>
              </div>
            </div>
            <div id="log-mode-range" class="log-time-panel hidden">
              <div class="form-grid-2">
                <div>
                  <label for="log-start-time" style="font-size: 12px; font-weight: normal; color: #555;">Start Time</label>
                  <input type="time" id="log-start-time" value="14:00" />
                </div>
                <div>
                  <label for="log-end-time" style="font-size: 12px; font-weight: normal; color: #555;">End Time</label>
                  <input type="time" id="log-end-time" value="15:30" />
                </div>
              </div>
            </div>
            <div id="log-duration-preview" class="log-duration-preview">Calculated: 1h 30m (90 min)</div>
          </div>
          <div class="form-row">
            <label for="log-tag">Session Tag</label>
            <select id="log-tag">
              <option value="Deep Work">Deep Work</option>
              <option value="Exam Prep">Exam Prep</option>
              <option value="Lecture Review">Lecture Review</option>
              <option value="Exercises">Exercises</option>
              <option value="Project">Project</option>
            </select>
          </div>
          <div class="form-row">
            <label for="log-notes">Session Notes</label>
            <textarea id="log-notes" rows="2" placeholder="What did you cover?"></textarea>
          </div>
          <div class="dialog-actions">
            <div></div>
            <div class="dialog-actions-right">
              <button type="button" data-close-modal="modal-log">Cancel</button>
              <button type="submit">Save Log</button>
            </div>
          </div>
        </form>
      </dialog>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
