<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniSphere - Exams &amp; Assignments</title>
    <meta name="description" content="Manage exams, midterms, grades, and assignments." />
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body>
    <div id="root">
      <header class="site-header">
        <div class="header-top">
          <h2>UniSphere</h2>
          <div class="header-actions">
            <div id="sync-status" class="sync-status">Ready</div>
            <button type="button" id="btn-header-logout" hidden>Log-Out</button>
          </div>
        </div>
        <nav aria-label="Main Navigation">
          <ul id="nav-list" class="nav-list">
            <li><a href="/pages/dashboard.html" data-nav="dashboard">Dashboard</a></li>
            <li><a href="/pages/courses.html" data-nav="courses">Courses</a></li>
            <li><a href="/pages/logs.html" data-nav="logs">Session Logs</a></li>
            <li><a href="/pages/assignments.html" data-nav="assignments" class="active-nav">Exams &amp; Assignments</a></li>
            <li><a href="/pages/squads.html" data-nav="squads">Squads</a></li>
            <li><a href="/pages/settings.html" data-nav="settings">Settings</a></li>
          </ul>
        </nav>
      </header>

      <hr class="section-divider" />

      <main id="app-main" data-page="assignments">
        <div class="assignments-page-shell">
          <h1>Exams &amp; Assignments</h1>

          <section
            id="assignments-board-card"
            class="card assignments-board-card"
            aria-label="Exams and Assignments Schedule"
          >
            <div class="card-header">
              <h3>Exams</h3>
              <div class="card-toolbar">
                <select id="filter-assignment-type" class="inline-input" aria-label="Filter by Type">
                  <option value="all" selected>All Types</option>
                  <option value="Exam">Exam</option>
                  <option value="Midterm">Midterm</option>
                  <option value="Assignment">Assignment</option>
                </select>
                <button type="button" id="btn-assignments-add">Add Exam</button>
              </div>
            </div>

            <div class="table-wrap assignments-table-scroll" id="assignments-table-scroll">
              <table class="assignments-table">
                <thead>
                  <tr>
                    <th>Course</th>
                    <th>Type</th>
                    <th>Date</th>
                    <th>Grade</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="assignments-registry-tbody"></tbody>
              </table>
            </div>
          </section>
        </div>
      </main>

      <!-- Native HTML Dialog: Add / Edit Exam or Assignment -->
      <dialog id="modal-assignment">
        <form id="form-assignment" method="dialog">
          <h3 id="modal-assignment-title">Add Exam / Assignment</h3>
          <input type="hidden" id="assignment-id" />
          <div class="form-row">
            <label for="assignment-course">Course *</label>
            <input
              type="text"
              id="assignment-course"
              list="course-suggestions"
              required
              placeholder="e.g. Analisi 1"
            />
            <datalist id="course-suggestions"></datalist>
          </div>
          <div class="form-grid-2">
            <div class="form-row">
              <label for="assignment-type">Type *</label>
              <select id="assignment-type">
                <option value="Exam">Exam</option>
                <option value="Midterm">Midterm (Esonero)</option>
                <option value="Assignment">Assignment</option>
              </select>
            </div>
            <div class="form-row">
              <label for="assignment-due">Date *</label>
              <input type="date" id="assignment-due" required />
            </div>
          </div>
          <div id="assignment-single-grade-panel" class="form-row">
            <label for="assignment-grade">Grade (0–30)</label>
            <input
              type="number"
              id="assignment-grade"
              min="0"
              max="30"
              step="0.5"
              placeholder="Optional (0-30)"
            />
          </div>
          <div id="assignment-midterm-grades-panel" class="form-row" hidden>
            <div class="form-grid-2">
              <div>
                <label for="assignment-esonero1" class="log-sublabel">Esonero 1 (0–30)</label>
                <input
                  type="number"
                  id="assignment-esonero1"
                  min="0"
                  max="30"
                  step="0.5"
                  placeholder="-"
                />
              </div>
              <div>
                <label for="assignment-esonero2" class="log-sublabel">Esonero 2 (0–30)</label>
                <input
                  type="number"
                  id="assignment-esonero2"
                  min="0"
                  max="30"
                  step="0.5"
                  placeholder="-"
                />
              </div>
            </div>
            <div id="assignment-esonero-average-preview" class="assignment-grade-preview">
              Average Grade: -
            </div>
          </div>
          <div class="form-row assignment-completed-row">
            <label class="checkbox-inline" for="assignment-completed">
              <input type="checkbox" id="assignment-completed" />
              <span>Mark as completed</span>
            </label>
          </div>
          <div class="dialog-actions">
            <button type="button" id="btn-delete-assignment" class="btn-danger" hidden>Delete</button>
            <div class="dialog-actions-right">
              <button type="button" data-close-modal="modal-assignment">Cancel</button>
              <button type="submit">Save</button>
            </div>
          </div>
        </form>
      </dialog>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
